<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Discussion Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            height: 6px; width: 6px; background-color: #94a3b8; border-radius: 50%; display: inline-block; margin: 0 1px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }

        /* Speaking pulse animation */
        @keyframes speakPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); }
            50% { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
        }
        .speaking { animation: speakPulse 1s infinite; }

        /* Voice tone bar visualizer */
        .voice-bar { display: inline-block; width: 3px; border-radius: 2px; margin: 0 1px; }
        @keyframes barBounce { 0%, 100% { height: 4px; } 50% { height: 14px; } }
        .voice-bar:nth-child(1) { animation: barBounce 0.6s ease infinite; }
        .voice-bar:nth-child(2) { animation: barBounce 0.6s ease 0.1s infinite; }
        .voice-bar:nth-child(3) { animation: barBounce 0.6s ease 0.2s infinite; }

        /* Tone badge */
        .tone-badge {
            font-size: 9px; padding: 2px 6px; border-radius: 999px;
            font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden text-slate-800">

    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col h-full z-10 transition-transform duration-300 transform -translate-x-full md:translate-x-0 fixed md:relative" id="sidebar">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-600 text-white">
            <h1 class="font-bold text-lg flex items-center gap-2"><i class="fas fa-users-cog"></i> GD Coach</h1>
            <button id="closeSidebar" class="md:hidden text-white hover:text-indigo-200"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 chat-scroll">
            <!-- Topic -->
            <div class="mb-5">
                <label class="block text-sm font-semibold mb-2 text-slate-700">Discussion Topic</label>
                <select id="topicSelect" class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="Impact of Artificial Intelligence on Society">Impact of AI</option>
                    <option value="The Future of Remote Work">Remote Work</option>
                    <option value="Climate Change and Individual Action">Climate Change</option>
                    <option value="Social Media's effect on Mental Health">Social Media & Mental Health</option>
                </select>
            </div>

            <!-- Voice Settings -->
            <div class="mb-5 border border-indigo-100 rounded-lg overflow-hidden bg-indigo-50">
                <div class="px-4 py-3 bg-indigo-100 flex items-center justify-between">
                    <h2 class="text-sm font-bold text-indigo-800 flex items-center gap-2">
                        <i class="fas fa-volume-up"></i> Voice Settings
                    </h2>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="voiceToggle" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:bg-indigo-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
                    </label>
                </div>
                <div class="p-3 space-y-2 text-xs text-slate-600">
                    <div>
                        <label class="block text-slate-500 mb-1 font-medium">Speech Rate</label>
                        <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="1" class="w-full accent-indigo-500">
                        <div class="flex justify-between text-[10px] text-slate-400"><span>Slow</span><span id="rateLabel">1.0×</span><span>Fast</span></div>
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1 font-medium">Auto-speak new messages</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="autoSpeak" class="sr-only peer">
                            <div class="w-8 h-4 bg-gray-300 rounded-full peer peer-checked:bg-indigo-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4"></div>
                            <span class="ml-2 text-slate-600">Enabled</span>
                        </label>
                    </div>
                    <p class="text-[10px] text-slate-400 pt-1">Each character has a unique voice tone. Click the 🔊 on any message to hear it.</p>
                </div>
            </div>

            <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 border-b pb-2">Character Traits</h2>
            <div id="characterForms" class="space-y-4"></div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full bg-slate-50 relative w-full">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 shrink-0 shadow-sm">
            <div class="flex items-center gap-3">
                <button id="openSidebar" class="md:hidden text-slate-500 hover:text-slate-800"><i class="fas fa-bars text-xl"></i></button>
                <div>
                    <h2 class="font-semibold text-slate-800 truncate" id="headerTopic">Impact of AI</h2>
                    <p class="text-xs text-slate-500" id="participantsLabel">Participants: You, Andy, Jelly, Fighter</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Currently speaking indicator -->
                <div id="speakingIndicator" class="hidden items-center gap-2 text-xs text-indigo-600 font-medium bg-indigo-50 px-3 py-1.5 rounded-full">
                    <span class="flex items-baseline gap-0.5">
                        <span class="voice-bar bg-indigo-400"></span>
                        <span class="voice-bar bg-indigo-500"></span>
                        <span class="voice-bar bg-indigo-400"></span>
                    </span>
                    <span id="speakingName">Speaking...</span>
                </div>
                <button id="stopSpeakBtn" class="hidden bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
                    <i class="fas fa-stop"></i> Stop
                </button>
                <button id="analyzeBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow flex items-center gap-2">
                    <i class="fas fa-chart-line"></i> <span class="hidden sm:inline">Analyze</span>
                </button>
            </div>
        </header>

        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 chat-scroll flex flex-col gap-4">
            <div class="text-center text-xs text-slate-400 my-2">Discussion started. Start typing to begin.</div>
        </div>

        <div class="p-4 bg-white border-t border-slate-200 shrink-0">
            <form id="chatForm" class="max-w-4xl mx-auto relative flex items-end gap-2">
                <textarea id="messageInput" rows="1" class="w-full bg-slate-100 border-0 rounded-xl py-3 px-4 pr-12 focus:ring-2 focus:ring-indigo-500 resize-none chat-scroll text-sm" placeholder="Type your response..."></textarea>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full w-10 h-10 flex items-center justify-center shrink-0 transition absolute right-2 bottom-1.5">
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Analysis Modal -->
    <div id="analysisModal" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-50">
                <h3 class="font-bold text-lg text-indigo-900"><i class="fas fa-robot mr-2"></i> Coach's Analysis</h3>
                <button id="closeModal" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="analysisContent" class="p-6 overflow-y-auto chat-scroll flex-1 text-sm text-slate-700 space-y-4"></div>
        </div>
    </div>

    <script>
    // ── State ──────────────────────────────────────────────────────────────────
    const state = {
        topic: 'Impact of Artificial Intelligence on Society',
        chatHistory: [],
        isGenerating: false,
        voiceEnabled: true,
        autoSpeak: false,
        speechRate: 1.0,
        currentUtterance: null,
        isSpeaking: false,
        characters: {
            Andy: {
                basePrompt: "You are Andy, a highly technical, critical thinker who relies strictly on facts, data, and logic. You are somewhat dry but very knowledgeable.",
                location: 'Silicon Valley, USA',
                height: '6ft 1in',
                background: 'Data Scientist & Systems Engineer',
                tone: 'Formal, precise, slightly condescending',
                opinions: 'Data over feelings. Efficiency is paramount.',
                color: 'bg-blue-100 text-blue-800',
                icon: 'fa-laptop-code',
                voice: { pitch: 0.85, rate: 0.95, gender: 'male', toneLabel: 'Deep & Formal', toneBg: 'bg-blue-200 text-blue-900' }
            },
            Jelly: {
                basePrompt: "You are Jelly, an empathetic, observant person who loves to connect abstract facts to real-life, day-to-day examples. You try to find the human element in everything.",
                location: 'Portland, Oregon',
                height: '5ft 5in',
                background: 'Social Worker & Community Organizer',
                tone: 'Warm, relatable, conversational',
                opinions: 'Human connection and well-being matter most.',
                color: 'bg-emerald-100 text-emerald-800',
                icon: 'fa-heart',
                voice: { pitch: 1.3, rate: 1.05, gender: 'female', toneLabel: 'Warm & Bright', toneBg: 'bg-emerald-200 text-emerald-900' }
            },
            Fighter: {
                basePrompt: "You are Fighter, a contrarian and disruptor. Your main goal is to constantly divert the topic to something completely irrelevant, controversial, or personal. You challenge the user directly.",
                location: 'New York City',
                height: '5ft 10in',
                background: 'Debate Club Champion, former political pundit',
                tone: 'Aggressive, sarcastic, provocative',
                opinions: 'The current topic is boring, let us talk about something else entirely.',
                color: 'bg-rose-100 text-rose-800',
                icon: 'fa-fire',
                voice: { pitch: 0.7, rate: 1.2, gender: 'male', toneLabel: 'Rough & Fast', toneBg: 'bg-rose-200 text-rose-900' }
            }
        }
    };

    // ── DOM ────────────────────────────────────────────────────────────────────
    const DOM = {
        topicSelect: document.getElementById('topicSelect'),
        headerTopic: document.getElementById('headerTopic'),
        charFormsContainer: document.getElementById('characterForms'),
        chatContainer: document.getElementById('chatContainer'),
        chatForm: document.getElementById('chatForm'),
        messageInput: document.getElementById('messageInput'),
        analyzeBtn: document.getElementById('analyzeBtn'),
        analysisModal: document.getElementById('analysisModal'),
        closeModal: document.getElementById('closeModal'),
        analysisContent: document.getElementById('analysisContent'),
        sidebar: document.getElementById('sidebar'),
        openSidebar: document.getElementById('openSidebar'),
        closeSidebar: document.getElementById('closeSidebar'),
        voiceToggle: document.getElementById('voiceToggle'),
        autoSpeak: document.getElementById('autoSpeak'),
        speechRate: document.getElementById('speechRate'),
        rateLabel: document.getElementById('rateLabel'),
        speakingIndicator: document.getElementById('speakingIndicator'),
        speakingName: document.getElementById('speakingName'),
        stopSpeakBtn: document.getElementById('stopSpeakBtn'),
    };

    // ── Voice Engine ───────────────────────────────────────────────────────────
    const voiceEngine = {
        voices: [],
        loaded: false,

        init() {
            if ('speechSynthesis' in window) {
                const load = () => {
                    this.voices = window.speechSynthesis.getVoices();
                    this.loaded = true;
                };
                load();
                window.speechSynthesis.onvoiceschanged = load;
            }
        },

        pickVoice(gender) {
            const pref = gender === 'female'
                ? v => /female|woman|zira|samantha|victoria|karen|moira|fiona|veena|tessa|susan/i.test(v.name)
                : v => /male|man|daniel|david|mark|alex|fred|thomas/i.test(v.name);
            return this.voices.find(pref) || this.voices.find(v => /en/i.test(v.lang)) || this.voices[0] || null;
        },

        speak(text, charName, onStart, onEnd) {
            if (!('speechSynthesis' in window) || !state.voiceEnabled) return;
            window.speechSynthesis.cancel();

            const char = state.characters[charName];
            const utter = new SpeechSynthesisUtterance(text);

            if (char) {
                const v = char.voice;
                utter.pitch = v.pitch;
                utter.rate = v.rate * state.speechRate;
                const voice = this.pickVoice(v.gender);
                if (voice) utter.voice = voice;
            } else {
                utter.pitch = 1.1;
                utter.rate = state.speechRate;
            }

            utter.onstart = () => { state.isSpeaking = true; onStart && onStart(); };
            utter.onend = () => { state.isSpeaking = false; onEnd && onEnd(); };
            utter.onerror = () => { state.isSpeaking = false; onEnd && onEnd(); };

            state.currentUtterance = utter;
            window.speechSynthesis.speak(utter);
        },

        stop() {
            window.speechSynthesis.cancel();
            state.isSpeaking = false;
        }
    };

    function showSpeakingIndicator(name) {
        DOM.speakingIndicator.classList.remove('hidden');
        DOM.speakingIndicator.classList.add('flex');
        DOM.speakingName.textContent = name + ' speaking...';
        DOM.stopSpeakBtn.classList.remove('hidden');
    }
    function hideSpeakingIndicator() {
        DOM.speakingIndicator.classList.add('hidden');
        DOM.speakingIndicator.classList.remove('flex');
        DOM.stopSpeakBtn.classList.add('hidden');
        // reset all speak button icons
        document.querySelectorAll('.speak-btn').forEach(btn => {
            btn.innerHTML = '<i class="fas fa-volume-up"></i>';
            btn.classList.remove('speaking', 'text-indigo-600');
        });
    }

    // ── UI ─────────────────────────────────────────────────────────────────────
    function addMessageToUI(name, text, isUser = false, autoSpeakThis = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-4 animate-fadeIn`;

        let charStyle = 'bg-slate-200 text-slate-800';
        let icon = 'fa-user';
        let toneLabel = '';
        let toneBg = '';

        if (state.characters[name]) {
            charStyle = state.characters[name].color;
            icon = state.characters[name].icon;
            toneLabel = state.characters[name].voice.toneLabel;
            toneBg = state.characters[name].voice.toneBg;
        } else if (isUser) {
            charStyle = 'bg-indigo-600 text-white';
        }

        const msgId = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2);

        // Speak button (shown on AI messages)
        const speakBtnHtml = !isUser ? `
            <button class="speak-btn ml-2 text-slate-400 hover:text-indigo-600 transition text-xs px-1.5 py-1 rounded hover:bg-slate-100"
                data-text="${text.replace(/"/g, '&quot;')}" data-name="${name}" data-id="${msgId}" title="Listen to ${name}">
                <i class="fas fa-volume-up"></i>
            </button>
        ` : '';

        const toneBadgeHtml = (!isUser && toneLabel) ? `
            <span class="tone-badge ${toneBg} ml-1">${toneLabel}</span>
        ` : '';

        wrapper.innerHTML = `
            <div class="max-w-[85%] sm:max-w-[75%] flex flex-col ${isUser ? 'items-end' : 'items-start'}">
                <span class="text-[11px] font-semibold text-slate-500 mb-1 ml-1 flex items-center gap-1 flex-wrap">
                    ${!isUser ? `<i class="fas ${icon} text-[10px]"></i>` : ''}
                    ${name}
                    ${toneBadgeHtml}
                </span>
                <div id="${msgId}" class="${charStyle} px-4 py-2.5 rounded-2xl ${isUser ? 'rounded-tr-sm' : 'rounded-tl-sm'} shadow-sm text-sm whitespace-pre-wrap">${text}</div>
                ${!isUser ? `<div class="flex items-center mt-1 ml-1">${speakBtnHtml}</div>` : ''}
            </div>
        `;

        DOM.chatContainer.appendChild(wrapper);
        DOM.chatContainer.scrollTop = DOM.chatContainer.scrollHeight;

        // Attach speak button handler
        if (!isUser) {
            const btn = wrapper.querySelector('.speak-btn');
            btn.addEventListener('click', () => {
                const btnText = btn.getAttribute('data-text');
                const btnName = btn.getAttribute('data-name');

                if (state.isSpeaking) {
                    voiceEngine.stop();
                    hideSpeakingIndicator();
                    return;
                }

                btn.innerHTML = '<i class="fas fa-stop"></i>';
                btn.classList.add('speaking', 'text-indigo-600');
                showSpeakingIndicator(btnName);

                voiceEngine.speak(btnText, btnName,
                    () => {},
                    () => { hideSpeakingIndicator(); btn.innerHTML = '<i class="fas fa-volume-up"></i>'; btn.classList.remove('speaking', 'text-indigo-600'); }
                );
            });

            // Auto-speak if enabled
            if (autoSpeakThis && state.autoSpeak && state.voiceEnabled) {
                setTimeout(() => {
                    btn.click();
                }, 400);
            }
        }
    }

    function showTypingIndicator(name) {
        const id = `typing-${Date.now()}`;
        const wrapper = document.createElement('div');
        wrapper.id = id;
        wrapper.className = 'flex justify-start mb-4';
        wrapper.innerHTML = `
            <div class="max-w-[75%] flex flex-col items-start">
                <span class="text-[11px] font-semibold text-slate-500 mb-1 ml-1">${name} is typing...</span>
                <div class="bg-slate-200 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm flex items-center typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        `;
        DOM.chatContainer.appendChild(wrapper);
        DOM.chatContainer.scrollTop = DOM.chatContainer.scrollHeight;
        return id;
    }

    function removeTypingIndicator(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    // ── Character Forms ────────────────────────────────────────────────────────
    function renderCharacterForms() {
        DOM.charFormsContainer.innerHTML = Object.keys(state.characters).map(charName => {
            const char = state.characters[charName];
            return `
                <div class="border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
                    <button type="button" class="w-full px-4 py-3 bg-slate-100 flex justify-between items-center text-sm font-semibold text-slate-700 hover:bg-slate-200 transition" onclick="toggleAccordion('${charName}')">
                        <span class="flex items-center gap-2">
                            <i class="fas ${char.icon} w-4"></i> ${charName}
                            <span class="tone-badge ${char.voice.toneBg}">${char.voice.toneLabel}</span>
                        </span>
                        <i class="fas fa-chevron-down text-xs transition-transform" id="icon-${charName}"></i>
                    </button>
                    <div id="content-${charName}" class="hidden p-3 space-y-3 text-xs">
                        ${['location', 'height', 'background', 'tone', 'opinions'].map(field => `
                            <div>
                                <label class="block text-slate-500 capitalize mb-1">${field}</label>
                                <input type="text" data-char="${charName}" data-field="${field}" value="${char[field]}" class="char-input w-full p-1.5 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none">
                            </div>
                        `).join('')}
                        <div>
                            <label class="block text-slate-500 mb-1">Voice Pitch</label>
                            <input type="range" min="0.5" max="2" step="0.05" value="${char.voice.pitch}"
                                data-char="${charName}" data-voice-field="pitch"
                                class="voice-input w-full accent-indigo-500">
                            <div class="text-[10px] text-slate-400 mt-0.5">Pitch: <span id="pitch-${charName}">${char.voice.pitch}</span></div>
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-1">Voice Speed</label>
                            <input type="range" min="0.5" max="2" step="0.1" value="${char.voice.rate}"
                                data-char="${charName}" data-voice-field="rate"
                                class="voice-input w-full accent-indigo-500">
                            <div class="text-[10px] text-slate-400 mt-0.5">Rate: <span id="rate-${charName}">${char.voice.rate}×</span></div>
                        </div>
                        <button class="test-voice-btn w-full text-center text-xs py-1.5 rounded bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-medium transition flex items-center justify-center gap-1.5" data-char="${charName}">
                            <i class="fas fa-play text-[10px]"></i> Test ${charName}'s Voice
                        </button>
                    </div>
                </div>
            `;
        }).join('');

        document.querySelectorAll('.char-input').forEach(input => {
            input.addEventListener('change', (e) => {
                state.characters[e.target.getAttribute('data-char')][e.target.getAttribute('data-field')] = e.target.value;
            });
        });

        document.querySelectorAll('.voice-input').forEach(input => {
            input.addEventListener('input', (e) => {
                const charName = e.target.getAttribute('data-char');
                const field = e.target.getAttribute('data-voice-field');
                const val = parseFloat(e.target.value);
                state.characters[charName].voice[field] = val;
                document.getElementById(`${field}-${charName}`).textContent = field === 'rate' ? val + '×' : val;
            });
        });

        document.querySelectorAll('.test-voice-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const charName = btn.getAttribute('data-char');
                const char = state.characters[charName];
                const sample = `Hello, I'm ${charName}. ${char.tone}. My background is in ${char.background}.`;
                voiceEngine.speak(sample, charName, () => showSpeakingIndicator(charName), () => hideSpeakingIndicator());
            });
        });
    }

    window.toggleAccordion = function(charName) {
        document.getElementById(`content-${charName}`).classList.toggle('hidden');
        document.getElementById(`icon-${charName}`).classList.toggle('rotate-180');
    };

    // ── Claude API ─────────────────────────────────────────────────────────────
    async function callClaude(systemPrompt, userPrompt) {
        try {
            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "claude-sonnet-4-6",
                    max_tokens: 1000,
                    system: systemPrompt,
                    messages: [{ role: "user", content: userPrompt }]
                })
            });
            const data = await response.json();
            return data.content?.[0]?.text || "No response.";
        } catch (err) {
            console.error("Claude API error:", err);
            return "Sorry, I'm having trouble connecting right now.";
        }
    }

    function formatHistory() {
        return state.chatHistory.map(m => `${m.name}: ${m.text}`).join('\n') || 'No messages yet.';
    }

    async function generateAIResponse(charName) {
        const char = state.characters[charName];
        const sys = `${char.basePrompt}
Your Traits:
- Location: ${char.location}
- Background: ${char.background}
- Tone of Voice: ${char.tone}
- Opinions: ${char.opinions}

You are in a group discussion. Topic: "${state.topic}".
Keep your response concise (1-3 sentences). Let your personality and tone heavily influence your reply.
Do NOT prefix with your name or use quotes around your response.`;

        const prompt = `Current discussion:\n${formatHistory()}\n\n[Respond as ${charName}]`;
        return await callClaude(sys, prompt);
    }

    async function runAISequence() {
        state.isGenerating = true;
        DOM.messageInput.disabled = true;
        DOM.messageInput.placeholder = "Wait for others to speak...";

        const speakers = ['Fighter', 'Andy', 'Jelly'];
        for (let i = speakers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [speakers[i], speakers[j]] = [speakers[j], speakers[i]];
        }

        for (const charName of speakers.slice(0, 2)) {
            const typingId = showTypingIndicator(charName);
            await new Promise(r => setTimeout(r, 1000 + Math.random() * 1500));
            const text = await generateAIResponse(charName);
            removeTypingIndicator(typingId);
            state.chatHistory.push({ role: 'model', name: charName, text });
            addMessageToUI(charName, text, false, true);
            await new Promise(r => setTimeout(r, 800));
        }

        state.isGenerating = false;
        DOM.messageInput.disabled = false;
        DOM.messageInput.placeholder = "Type your response...";
        DOM.messageInput.focus();
    }

    // ── Events ─────────────────────────────────────────────────────────────────
    DOM.chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (state.isGenerating) return;
        const text = DOM.messageInput.value.trim();
        if (!text) return;
        DOM.messageInput.value = '';
        state.chatHistory.push({ role: 'user', name: 'User', text });
        addMessageToUI('You', text, true);
        await runAISequence();
    });

    DOM.messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        this.style.overflowY = this.scrollHeight > 120 ? 'auto' : 'hidden';
    });

    DOM.messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            DOM.chatForm.dispatchEvent(new Event('submit'));
        }
    });

    DOM.topicSelect.addEventListener('change', (e) => {
        state.topic = e.target.value;
        DOM.headerTopic.textContent = state.topic;
        DOM.chatContainer.innerHTML = '<div class="text-center text-xs text-slate-400 my-2">Topic changed. Start typing to begin the new discussion.</div>';
        state.chatHistory = [];
        voiceEngine.stop();
    });

    DOM.voiceToggle.addEventListener('change', (e) => {
        state.voiceEnabled = e.target.checked;
        if (!state.voiceEnabled) { voiceEngine.stop(); hideSpeakingIndicator(); }
    });

    DOM.autoSpeak.addEventListener('change', (e) => { state.autoSpeak = e.target.checked; });

    DOM.speechRate.addEventListener('input', (e) => {
        state.speechRate = parseFloat(e.target.value);
        DOM.rateLabel.textContent = state.speechRate.toFixed(1) + '×';
    });

    DOM.stopSpeakBtn.addEventListener('click', () => {
        voiceEngine.stop();
        hideSpeakingIndicator();
    });

    DOM.analyzeBtn.addEventListener('click', async () => {
        if (state.chatHistory.length < 3) {
            alert("Please have a longer discussion first before analyzing.");
            return;
        }
        DOM.analysisModal.classList.remove('hidden');
        DOM.analysisContent.innerHTML = `
            <div class="flex items-center justify-center h-32 flex-col gap-4">
                <div class="typing-indicator flex items-center gap-1"><span class="w-2 h-2 bg-indigo-500"></span><span class="w-2 h-2 bg-indigo-500"></span><span class="w-2 h-2 bg-indigo-500"></span></div>
                <span class="text-slate-500 font-medium">Coach is reviewing your responses...</span>
            </div>
        `;

        const sys = `You are an expert Group Discussion Coach. Review the transcript and evaluate the 'User'.
Pay attention to:
1. Did they keep 'Fighter' (who constantly derails) on topic?
2. Did they interact well with 'Andy' (technical) and 'Jelly' (emotional)?
3. Overall contribution to the topic.
Format in simple HTML using <ul>, <li>, <strong>, <p>. Be constructive and specific. Do not use Markdown backticks.`;

        const result = await callClaude(sys, `Topic: ${state.topic}\n\nTranscript:\n${formatHistory()}`);
        DOM.analysisContent.innerHTML = `<div class="prose prose-sm prose-indigo max-w-none">${result.replace(/```html|```/g, '')}</div>`;
    });

    DOM.closeModal.addEventListener('click', () => DOM.analysisModal.classList.add('hidden'));
    DOM.openSidebar.addEventListener('click', () => DOM.sidebar.classList.remove('-translate-x-full'));
    DOM.closeSidebar.addEventListener('click', () => DOM.sidebar.classList.add('-translate-x-full'));

    // ── Init ───────────────────────────────────────────────────────────────────
    voiceEngine.init();
    renderCharacterForms();
    </script>
</body>
</html>
